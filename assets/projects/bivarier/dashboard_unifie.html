  * { box-sizing: border-box; }

  .section-title { font-size:12px; font-weight:700; text-transform:uppercase;
                   color:#7f8c8d; margin:20px 0 10px; letter-spacing:0.5px; }
  .section-title:first-child { margin-top:0; }
  .stat-row { display:flex; justify-content:space-between; align-items:center;
              padding:6px 0; font-size:13px; border-bottom:1px dashed #e1e8ed; }
  .stat-row:last-child { border-bottom:none; }
  .stat-label { color:#555; }
  .stat-value { font-weight:600; color:#2c3e50; }
  .card { background:white; padding:14px 16px; border-radius:8px;
          box-shadow:0 2px 6px rgba(0,0,0,0.06); margin-bottom:12px; }
  .card.highlight { border-left:4px solid #3b4994; }
  .badge { display:inline-block; padding:3px 10px; border-radius:10px;
           font-size:10px; font-weight:700; text-transform:uppercase; color:white; }
  .badge.low  { background:#27ae60; }
  .badge.mid  { background:#e67e22; }
  .badge.high { background:#c0392b; }
  .big-number { font-size:28px; font-weight:700; margin:4px 0; }
  .big-number.risk-high { color:#c0392b; }
  .big-number.risk-mid  { color:#e67e22; }
  .big-number.risk-low  { color:#27ae60; }
  .hint { text-align:center; padding:20px; color:#95a5a6; font-size:12px;
          font-style:italic; }
  .legend-mini { display:flex; justify-content:center; margin:10px 0; }
  .legend-mini table { border-collapse:collapse; }
  .legend-mini td { width:18px; height:18px; }
  .legend-caption { font-size:10px; color:#888; text-align:center;
                    font-style:italic; line-height:1.3; }
</style>

  var natCorr = 0.065;

  function fmtNum(n) {
    if (n === null || n === undefined) return 'N/A';
    return n.toLocaleString('fr-FR');
  }

  function buildDeptFiche(dep) {
    var s = depStats[dep];
    if (!s) return '';
    var arrow = s.fdep_vs_nat > 0.3 ? '🔺' : s.fdep_vs_nat < -0.3 ? '🔻' : '≈';
    var lab   = s.fdep_vs_nat > 0.3 ? 'plus défavorisé' :
                s.fdep_vs_nat < -0.3 ? 'moins défavorisé' : 'proche moyenne';
    var rCls = s.pct_class33 >= 15 ? 'high' : s.pct_class33 >= 8 ? 'mid' : 'low';
    var rTxt = s.pct_class33 >= 15 ? 'ÉLEVÉ' : s.pct_class33 >= 8 ? 'MODÉRÉ' : 'FAIBLE';
    var corrTxt = s.corr_loc !== null
      ? s.corr_loc.toFixed(2) + ' <span style="color:#888; font-size:11px;">(France: ' + natCorr.toFixed(2) + ')</span>'
      : '<span style="color:#888;">insuffisant</span>';
    var ecart = (s.fdep_vs_nat > 0 ? '+' : '') + s.fdep_vs_nat;

    return ''
      + '<div class="section-title">📍 ' + dep + ' — ' + s.nom + '</div>'
      + '<div class="card highlight">'
      +   '<div style="font-size:11px; color:#7f8c8d; text-transform:uppercase; font-weight:600;">Zone prioritaire EEPATHO</div>'
      +   '<div class="big-number risk-' + rCls + '">' + s.pct_class33.toFixed(1) + ' %</div>'
      +   '<div style="font-size:12px; color:#666;">double peine &nbsp;<span class="badge ' + rCls + '">' + rTxt + '</span></div>'
      + '</div>'
      + '<div class="card">'
      +   '<div style="font-size:11px; color:#7f8c8d; text-transform:uppercase; font-weight:600; margin-bottom:8px;">Vue d\'ensemble</div>'
      +   '<div class="stat-row"><span class="stat-label">Communes</span><span class="stat-value">' + fmtNum(s.n_comm) + '</span></div>'
      +   '<div class="stat-row"><span class="stat-label">Population</span><span class="stat-value">' + fmtNum(s.pop_tot) + '</span></div>'
      + '</div>'
      + '<div class="card">'
      +   '<div style="font-size:11px; color:#7f8c8d; text-transform:uppercase; font-weight:600; margin-bottom:8px;">Défavorisation (FDep)</div>'
      +   '<div class="stat-row"><span class="stat-label">Médiane locale</span><span class="stat-value">' + s.fdep_med + '</span></div>'
      +   '<div class="stat-row"><span class="stat-label">Vs France</span><span class="stat-value">' + arrow + ' ' + ecart + '</span></div>'
      +   '<div style="font-size:11px; color:#888; margin-top:4px; font-style:italic;">' + lab + '</div>'
      + '</div>'
      + '<div class="card">'
      +   '<div style="font-size:11px; color:#7f8c8d; text-transform:uppercase; font-weight:600; margin-bottom:8px;">Débits de tabac</div>'
      +   '<div class="stat-row"><span class="stat-label">Total</span><span class="stat-value">' + fmtNum(s.n_debits) + '</span></div>'
      +   '<div class="stat-row"><span class="stat-label">Densité médiane</span><span class="stat-value">' + s.dens_med + ' /10k</span></div>'
      +   '<div class="stat-row"><span class="stat-label">Sans débit</span><span class="stat-value">' + s.pct_no_tabac + ' %</span></div>'
      + '</div>'
      + '<div class="card">'
      +   '<div style="font-size:11px; color:#7f8c8d; text-transform:uppercase; font-weight:600; margin-bottom:8px;">Corrélation locale</div>'
      +   '<div class="stat-row"><span class="stat-label">Spearman FDep×Tabac</span><span class="stat-value">' + corrTxt + '</span></div>'
      + '</div>';
  }

  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'depChange') {
      var dep = event.data.dep;
      var natBox = document.getElementById('stats-national');
      var depBox = document.getElementById('stats-dept');
      if (dep === 'all' || !dep) {
        natBox.style.display = 'block';
        depBox.innerHTML = '';
      } else {
        natBox.style.display = 'none';
        depBox.innerHTML = buildDeptFiche(dep);
      }
    }
  });
</script>
