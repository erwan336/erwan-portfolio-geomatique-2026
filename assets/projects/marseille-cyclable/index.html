<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marseille — Réseau cyclable (analyse)</title>

  <!-- Leaflet + MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Turf & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0c10; --panel:#111318; --muted:#a9b1bd;
      --accent:#00bcd4; --accent2:#4caf50; --outline:#0ea5e9;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#fff;font:14px/1.4 system-ui,Segoe UI,Arial}
    #map{height:100vh}

    /* Panneau flottant bas-droit */
    .hud{
      position:fixed; right:18px; bottom:18px; z-index:1000;
      background:rgba(17,19,24,.92); backdrop-filter:blur(4px);
      border:1px solid rgba(255,255,255,.06);
      border-radius:14px; padding:14px; box-shadow:0 12px 30px rgba(0,0,0,.35);
      max-width:760px; width:min(92vw,760px);
    }
    .hud_header{display:flex; gap:12px; align-items:center; margin-bottom:8px}
    .dot{width:8px;height:8px;border-radius:50%}
    .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:8px 0 6px}
    .kpi{background:#0f1217;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px}
    .kpi b{display:block;font-size:18px;margin-bottom:2px}
    .charts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .chart_card{background:#0f1217;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px}
    .chart_card canvas{width:100%;height:180px} /* compact */

    @media (max-width:780px){
      .kpis{grid-template-columns:1fr 1fr}
      .charts{grid-template-columns:1fr}
    }

    /* Légende mini (gauche-bas) */
    .legend{
      position:fixed; left:18px; bottom:18px; z-index:900;
      background:rgba(17,19,24,.92); padding:10px 12px; border-radius:10px;
      border:1px solid rgba(255,255,255,.06); color:#e6eef7; font-size:12px
    }
    .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-2px}
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Légende -->
  <div class="legend">
    <div><i style="background:var(--outline)"></i> Limite</div>
    <div><i style="background:var(--accent)"></i> Pistes</div>
    <div><i style="background:var(--accent2)"></i> Parkings</div>
  </div>

  <!-- HUD (KPIs + mini-graphs) -->
  <div class="hud">
    <div class="hud_header">
      <div class="dot" style="background:var(--accent)"></div>
      <div style="font-weight:600">Marseille — Réseau cyclable · Analyse</div>
      <div style="color:var(--muted);margin-left:auto" id="extent"></div>
    </div>

    <div class="kpis">
      <div class="kpi"><b id="kpi-pistes">–</b><span style="color:var(--muted)">km de pistes</span></div>
      <div class="kpi"><b id="kpi-parkings">–</b><span style="color:var(--muted)">parkings vélo</span></div>
      <div class="kpi"><b id="kpi-proches">–%</b><span style="color:var(--muted)">parkings <100 m des pistes</span></div>
    </div>

    <div class="charts">
      <div class="chart_card"><canvas id="chartParking"></canvas></div>
      <div class="chart_card"><canvas id="chartLongueur"></canvas></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./charts.js"></script>
</body>
</html>
